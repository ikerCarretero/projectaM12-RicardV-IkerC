services:
  mysql:
    image: mysql:8.0
    container_name: fantasy_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fantasy_champions
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: fantasy
      MYSQL_PASSWORD: fantasy
    ports:
      - "3336:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fantasy_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: fantasy_api
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost,127.0.0.1
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fantasy_champions
      DB_USERNAME: fantasy
      DB_PASSWORD: fantasy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - fantasy_net

volumes:
  mysql_data:
  vendor_data:

networks:
  fantasy_net:
    driver: bridge
